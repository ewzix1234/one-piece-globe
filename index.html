<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Blue Star — le monde de One Piece</title>
    <meta
      name="description"
      content="Globe interactif du monde de One Piece : 83 îles situées sur la sphère, de Fuchsia à Elbaf."
    />
    <meta name="theme-color" content="#04202f" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <div id="scene"></div>

    <div id="loader">
      <div class="loader-mark">BLUE STAR</div>
      <div class="loader-note" id="loader-note">Relevé des côtes…</div>
    </div>

    <header class="masthead">
      <div class="search">
        <label class="visually-hidden" for="search-input">Chercher une île</label>
        <input
          id="search-input"
          type="search"
          placeholder="Chercher une île…"
          autocomplete="off"
          spellcheck="false"
        />
        <ul class="results" id="search-results" role="listbox"></ul>
      </div>
    </header>

    <nav class="filters" id="filters" aria-label="Filtrer les îles">
      <span class="filters-title">Sagas</span>
    </nav>

    <button class="legend-toggle" id="legend-toggle" type="button" aria-expanded="false">
      <span aria-hidden="true">◈</span> Lire la carte
    </button>
    <aside class="legend" id="legend" hidden aria-label="Légende de la carte"></aside>

    <div class="voyage" id="voyage">
      <button class="cine-start" id="cine-start" type="button">
        <span class="cine-icon" aria-hidden="true">▶</span>
        <span class="cine-label">Revivre le voyage</span>
      </button>
      <span class="voyage-step" id="voyage-step">Route de l'équipage</span>
      <div class="voyage-nav">
        <button id="voyage-prev" type="button" title="Escale précédente" aria-label="Escale précédente">←</button>
        <button id="voyage-next" type="button" title="Escale suivante" aria-label="Escale suivante">→</button>
      </div>
    </div>

    <!-- Bandeau de la lecture cinématique, visible seulement pendant. -->
    <div class="cine-hud" id="cine-hud" hidden aria-live="polite">
      <div class="cine-track" id="cine-track" role="slider" tabindex="0"
           aria-label="Avancer dans le voyage" aria-valuemin="1" aria-valuemax="40">
        <i id="cine-progress"></i>
      </div>
      <div class="cine-read">
        <strong id="cine-place">Village de Fuchsia</strong>
        <span id="cine-sub"></span>
        <p id="cine-deed" hidden></p>
      </div>
      <div class="cine-actions">
        <button id="cine-speed" type="button" aria-label="Vitesse de lecture">×1</button>
        <button id="cine-skip" type="button" aria-label="Escale suivante">⏭</button>
        <button id="cine-pause" type="button" aria-label="Mettre en pause">❚❚</button>
        <button id="cine-replay" type="button" hidden aria-label="Rejouer le voyage">↻</button>
        <button id="cine-stop" type="button" aria-label="Arrêter la lecture">✕</button>
      </div>
    </div>

    <!-- Navigation aux flèches : un bandeau qui laisse voir le globe, au
         lieu de la fiche pleine qui le recouvrait. -->
    <div class="stopcard" id="stopcard" hidden aria-live="polite">
      <div class="stopcard-read">
        <strong id="stopcard-name"></strong>
        <span id="stopcard-meta"></span>
        <p id="stopcard-deed" hidden></p>
      </div>
      <div class="stopcard-actions">
        <button id="stopcard-open" type="button">Fiche complète</button>
        <button id="stopcard-close" type="button" aria-label="Fermer">✕</button>
      </div>
    </div>

    <aside class="record" id="record" aria-live="polite">
      <div class="record-grip" aria-hidden="true"></div>
      <button class="record-close" id="record-close" type="button" aria-label="Fermer la fiche">✕</button>
      <div class="record-scroll" id="record-scroll"></div>
    </aside>

    <script src="vendor/globe.gl.min.js"></script>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
